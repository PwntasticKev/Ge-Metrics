name: MCP server

on:
  push:
    branches: [main, master]
    paths: ['mcp/**', 'src/domain/flipping/**', 'mobile/src/engine/ge-engine.d.ts', '.github/workflows/mcp.yml']
  pull_request:
    paths: ['mcp/**', 'src/domain/flipping/**', 'mobile/src/engine/ge-engine.d.ts', '.github/workflows/mcp.yml']

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Dev tooling (vitest 5, tsup 9) needs Node 22; the built server runs on Node 20+.
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
