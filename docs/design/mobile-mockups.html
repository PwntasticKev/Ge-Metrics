<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--stone:#1E1A15;--panel:#2B251D;--panel2:#352E24;--bevel:#4B4133;--shadow:#14110D;--parch:#EDE3CB;--dim:#A39780;--orange:#FF981F;--green:#3FB950;--yellow:#F2D34B;--red:#D9534F}
.brand{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center;padding:4px 0 26px;font-family:'Barlow Semi Condensed',sans-serif;color:var(--foreground)}
.mark{display:flex;align-items:center;gap:14px}
.wm{font:700 30px/1 'Pixelify Sans',sans-serif;letter-spacing:.5px}.wm span{color:var(--orange)}
.tag{font-size:14px;color:var(--muted-foreground);margin-top:4px}
.sw{display:flex;gap:6px}.sw div{width:46px}.sw i{display:block;height:30px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.sw small{display:block;font-size:11px;margin-top:3px;color:var(--muted-foreground)}
.stack{font-size:13px;color:var(--muted-foreground);line-height:1.5}.stack b{font-weight:700;padding:1px 6px;border-radius:4px;background:var(--stone)}
.wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px 20px;padding:0 0 8px}
.cap{font:600 14px 'Barlow Semi Condensed',sans-serif;color:var(--foreground);margin:0 0 3px}
.sub{font:13px/1.4 'Barlow Semi Condensed',sans-serif;color:var(--muted-foreground);margin:0 0 10px;min-height:36px}
.ph{width:300px;margin:0 auto;border-radius:42px;padding:9px;background:#0c0b09;box-shadow:0 0 0 1px #3a3328,0 14px 40px rgba(0,0,0,.35)}
.s{height:620px;border-radius:34px;overflow:hidden;background:var(--stone);color:var(--parch);font:13px/1.3 'Barlow Semi Condensed',sans-serif;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;position:relative}
.st{display:flex;justify-content:space-between;padding:11px 24px 2px;font-size:12px;font-weight:600}
.b{flex:1;overflow:hidden;padding:4px 12px 0}
.hd{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 10px}
.ttl{font:700 24px/1 'Pixelify Sans',sans-serif;color:var(--orange);letter-spacing:.3px}
.upd{font-size:12px;color:var(--dim)}
.chips{display:flex;gap:6px;margin:0 0 10px}
.chip{white-space:nowrap;padding:5px 9px;border-radius:6px;background:var(--panel);box-shadow:inset 0 1px 0 var(--bevel),inset 0 -1px 0 var(--shadow);font-size:12.5px;color:var(--dim)}
.chip.on{color:var(--stone);background:var(--orange);box-shadow:inset 0 1px 0 #FFC27A,inset 0 -2px 0 #B8650C;font-weight:700}
.row{background:var(--panel);border-radius:6px;box-shadow:inset 0 1px 0 var(--bevel),inset 0 -2px 0 var(--shadow);padding:9px 10px;margin-bottom:7px}
.r1{display:flex;align-items:center;gap:9px}
.ic{width:34px;height:34px;flex:none;display:grid;place-items:center;background:var(--stone);border-radius:5px;box-shadow:inset 0 1px 2px #0008}
.ic img{max-width:28px;max-height:28px;image-rendering:pixelated}
.nm{font-weight:700;font-size:14.5px;line-height:1.1}.mt{font-size:12px;color:var(--dim)}
.big{margin-left:auto;text-align:right}.big b{font-size:19px;font-weight:700;display:block;line-height:1}.big small{font-size:11.5px;color:var(--dim)}
.px{display:flex;gap:6px;margin-top:8px}
.px div{flex:1;background:var(--stone);border-radius:4px;padding:5px 7px}
.px .k{font-size:11px;color:var(--dim)}.px .v{font-size:14px;font-weight:600}
.k{font-size:11px;color:var(--dim)}
.tb{display:flex;justify-content:space-around;padding:9px 6px 20px;background:var(--panel);box-shadow:inset 0 1px 0 var(--bevel)}
.t{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dim)}
.t svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}.t.on{color:var(--orange)}
.slot{background:var(--panel);border-radius:6px;box-shadow:inset 0 1px 0 var(--bevel),inset 0 -2px 0 var(--shadow);padding:8px 9px 9px;margin-bottom:7px}
.sl1{display:flex;align-items:center;gap:9px}
.kind{font:700 11px 'Pixelify Sans',sans-serif;padding:2px 6px;border-radius:3px;margin-left:auto}
.kind.buy{background:#3A2A12;color:var(--orange)}.kind.sell{background:#163220;color:var(--green)}
.bar{height:9px;border-radius:2px;background:#120F0B;box-shadow:inset 0 1px 2px #000;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(#FFB04D,#E07A00)}.bar i.done{background:linear-gradient(#5FD472,#2E8B3E)}
.step{font:500 12.5px 'Barlow Semi Condensed';color:var(--dim);margin:10px 2px 6px;display:flex;align-items:center;gap:6px}
.step em{font:700 11px 'Pixelify Sans';font-style:normal;color:var(--stone);background:var(--dim);border-radius:3px;padding:1px 5px}
.sum{background:#163220;border-radius:6px;padding:10px 12px;display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;box-shadow:inset 0 1px 0 #24502F}
.btn{margin-top:10px;text-align:center;padding:11px;border-radius:6px;background:var(--orange);color:var(--stone);font:700 15px 'Pixelify Sans';box-shadow:inset 0 1px 0 #FFC27A,inset 0 -3px 0 #B8650C}
.grid8{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.g8{background:var(--panel);border-radius:6px;box-shadow:inset 0 1px 0 var(--bevel),inset 0 -2px 0 var(--shadow);padding:7px 8px;min-height:76px;display:flex;flex-direction:column;gap:4px}
.g8.empty{min-height:40px;align-items:center;justify-content:center;color:#6b6152;font:500 12px 'Pixelify Sans';background:#241F18}
</style></head><body>
<div class="brand">
  <div class="mark">
    <svg width="58" height="58" viewBox="0 0 58 58" aria-label="GE Metrics app icon"><rect x="1" y="1" width="56" height="56" rx="13" fill="#2B251D" stroke="#4B4133" stroke-width="2"/><rect x="9" y="11" width="40" height="22" rx="3" fill="#1E1A15"/><text x="29" y="28" text-anchor="middle" font-family="Pixelify Sans" font-weight="700" font-size="17" fill="#FF981F">GE</text><rect x="9" y="39" width="40" height="8" rx="2" fill="#120F0B"/><rect x="9" y="39" width="27" height="8" rx="2" fill="#3FB950"/></svg>
    <div><div class="wm">GE <span>Metrics</span></div><div class="tag">Buy at this, sell at that, keep the difference.</div></div>
  </div>
  <div class="sw"><div><i style="background:#1E1A15"></i><small>Stone</small></div><div><i style="background:#2B251D"></i><small>Panel</small></div><div><i style="background:#EDE3CB"></i><small>Parchment</small></div><div><i style="background:#FF981F"></i><small>GE orange</small></div><div><i style="background:#3FB950"></i><small>Offer green</small></div></div>
  <div class="stack">Coin amounts use the in-game stack colors:<br><b style="color:#F2D34B">95,000</b> <b style="color:#F4EFE4">981K</b> <b style="color:#5BE38F">53.2M</b></div>
</div>
<div class="wrap" id="w"></div>
<script>
const W='https://oldschool.runescape.wiki/images/'
const N=n=>Math.round(n).toLocaleString('en-US')
const S=n=>{const a=Math.abs(n);return a>=1e9?(n/1e9).toFixed(2)+'B':a>=1e7?(n/1e6).toFixed(1)+'M':a>=1e6?(n/1e6).toFixed(2)+'M':a>=1e5?Math.round(n/1e3)+'K':N(n)}
const C=n=>n>=1e7?'#5BE38F':n>=1e5?'#F4EFE4':'#F2D34B'
const coin=n=>`<span style="color:${C(n)}">${S(n)}</span>`
const ic=f=>`<div class="ic"><img src="${W+f}" alt=""></div>`
const IC={sets:'<rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/>',items:'<circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.5h4a1.5 1.5 0 010 3h-3"/>',slots:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18M9 4v16M15 4v16"/>',tools:'<path d="M14 6l4 4-9 9H5v-4z"/><path d="M13 7l4 4"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'}
const tabs=on=>`<div class="tb">${[['sets','Sets'],['items','Items'],['slots','Slots'],['tools','Tools'],['me','Me']].map(([k,l])=>`<div class="t ${l==on?'on':''}"><svg viewBox="0 0 24 24">${IC[k]}</svg>${l}</div>`).join('')}</div>`
const phone=(cap,sub,body,tab)=>`<div><p class="cap">${cap}</p><p class="sub">${sub}</p><div class="ph"><div class="s"><div class="st"><span>9:41</span><span>●●● 5G ▮</span></div><div class="b">${body}</div>${tabs(tab)}</div></div></div>`

const sets=[["Torva armour set","Torva_armour_set.png",426140470,437800000,6659530,8,53276240,3],["Virtus armour set","Virtus_armour_set.png",53757779,55895995,1020297,8,8162376,3],["Justiciar armour set","Justiciar_armour_set.png",21088513,22519996,981084,8,7848672,3],["Ancestral robes set","Ancestral_robes_set.png",174358453,178793534,859211,8,6873688,3],["Blood Moon armour set","Blood_Moon_armour_set.png",14725330,15349999,317670,14,4447380,4],["Eclipse Moon armour set","Eclipse_Moon_armour_set.png",5370809,5672500,188241,15,2823615,4]]
const items=[["Obligator (uncharged)","Obligator_(uncharged).png",2540699000,2578700000,33001000,8,264008000],["Scythe of Vitur (uncharged)","Scythe_of_Vitur_(uncharged).png",1135489989,1146610010,6120021,8,48960168],["Horn of Bran","Horn_of_Bran.png",523715214,532636516,3921302,8,31370416],["Ascension crossbows","Ascension_crossbows.png",442420069,451000000,3579931,8,28639448],["Oathplate helm","Oathplate_helm.png",70920008,74989999,2570192,8,20561536],["Old school bond","Old_school_bond.png",9915569,10117927,202358,100,20235800]]
const torva=[["Torva full helm","Torva_full_helm.png",172500000],["Torva platebody","Torva_platebody.png",155751582],["Torva platelegs","Torva_platelegs.png",97888888]]

const out=[]
out.push(phone('1. Sets (home)','Opens straight to set flips, best 4-hour profit first. Every row says what to pay for the parts and what to sell the set for.',
`<div class="hd"><span class="ttl">Sets</span><span class="upd">38 profitable, 1m ago</span></div><div class="chips"><span class="chip on">4h profit</span><span class="chip">Profit each</span><span class="chip">ROI</span></div>`+
sets.slice(0,5).map(([n,f,b,s,p,m,pot,parts])=>`<div class="row"><div class="r1">${ic(f)}<div><div class="nm">${n.replace(' armour set','').replace(' robes set',' robes')}</div><div class="mt">Buy ${parts} parts, sell the set</div></div><div class="big"><b>${coin(pot)}</b><small><span style="color:var(--green)">+${S(p)}</span> each, ×${m}</small></div></div><div class="px"><div><div class="k">Buy parts at</div><div class="v">${N(b)}</div></div><div><div class="k">Sell set at</div><div class="v">${N(s)}</div></div></div></div>`).join(''),'Sets'))

out.push(phone('2. Set plan as GE offers','Tapping a set lays out the exact offers to place: one buy slot per part, then the sell slot. Quantities already respect buy limits.',
`<div class="hd"><span class="ttl" style="font-size:20px">Torva set</span><span class="upd">Prices 16m old</span></div>
<div class="step"><em>1</em>Place these buy offers</div>`+
torva.map(([n,f,p])=>`<div class="slot"><div class="sl1">${ic(f)}<div><div class="nm" style="font-size:13.5px">${n}</div><div class="mt">8 at ${N(p)} each</div></div><span class="kind buy">Buy</span></div></div>`).join('')+
`<div class="step"><em>2</em>Exchange the parts at a GE clerk</div><div class="step" style="margin-top:4px"><em>3</em>Sell the set</div>
<div class="slot"><div class="sl1">${ic('Torva_armour_set.png')}<div><div class="nm" style="font-size:13.5px">Torva armour set</div><div class="mt">8 at ${N(437800000)} each</div></div><span class="kind sell">Sell</span></div></div>
<div class="sum"><div><div class="k" style="color:#9FD3AA">After 5M tax per set</div><div style="font-size:13px">+${N(6659530)} each</div></div><div style="text-align:right"><div class="k" style="color:#9FD3AA">This window</div><div style="font-size:21px;font-weight:700;color:#5BE38F">+53.3M</div></div></div>
<div class="btn">Track these offers</div>`,'Sets'))

out.push(phone('3. Items','Single-item flips, same layout: buy at, sell at, profit each, and the total for one buy-limit window. Fluke trades are filtered out.',
`<div class="hd"><span class="ttl">Items</span><span class="upd">1,739 profitable</span></div><div class="chips"><span class="chip on">4h profit</span><span class="chip">Each</span><span class="chip">Under 10M</span><span class="chip">Starred</span></div>`+
items.slice(0,5).map(([n,f,b,s,p,m,pot])=>`<div class="row"><div class="r1">${ic(f)}<div><div class="nm">${n.replace(' (uncharged)','')}</div><div class="mt">Limit ${m}</div></div><div class="big"><b>${coin(pot)}</b><small><span style="color:var(--green)">+${S(p)}</span> each, ×${m}</small></div></div><div class="px"><div><div class="k">Buy at</div><div class="v">${N(b)}</div></div><div><div class="k">Sell at</div><div class="v">${N(s)}</div></div></div></div>`).join(''),'Items'))

const g8=(f,n,kind,pct,line)=>`<div class="g8"><div style="display:flex;align-items:center;gap:6px"><img src="${W+f}" style="max-height:24px;image-rendering:pixelated" alt=""><span class="kind ${kind}" style="margin-left:auto">${kind=='buy'?'Buy':'Sell'}</span></div><div class="nm" style="font-size:12.5px">${n}</div><div class="mt">${line}</div><div class="bar" style="margin-top:auto"><i class="${pct==100?'done':''}" style="width:${pct}%"></i></div></div>`
out.push(phone('4. Slots','Your 8 Grand Exchange slots mirrored on the phone. Fill them from a plan, update by hand or sync from the RuneLite plugin, and get pinged when a slot completes.',
`<div class="hd"><span class="ttl">Slots</span><span class="upd">5 of 8 in use</span></div>
<div class="grid8">${g8('Torva_full_helm.png','Torva full helm','buy',100,'8 of 8 bought')+g8('Torva_platebody.png','Torva platebody','buy',62,'5 of 8 bought')+g8('Torva_platelegs.png','Torva platelegs','buy',100,'8 of 8 bought')+g8('Old_school_bond.png','Old school bond','sell',30,'30 of 100 sold')+g8('Scythe_of_Vitur_(uncharged).png','Scythe of Vitur','buy',0,'Offer at 1.135B')}<div class="g8 empty">Empty</div><div class="g8 empty">Empty</div><div class="g8 empty">Empty</div></div>
<div class="sum" style="margin-top:10px"><div><div class="k" style="color:#9FD3AA">Locked in so far</div><div style="font-size:13px">Torva set 21 of 24 parts</div></div><div style="text-align:right"><div class="k" style="color:#9FD3AA">Expected today</div><div style="font-size:21px;font-weight:700;color:#5BE38F">+59.3M</div></div></div>`,'Slots'))
document.getElementById('w').innerHTML=out.join('')
</script></body></html>
